/* 카드면 — 통째로 회전한다. data-spin 값이 바뀌면 afterRender 에서 애니메이션을 붙인다 */
function faceHTML(card, rot, out, key) {
  var words = [0, 1, 2, 3].map(function (i) {
    var edge = (i + rot) % 4;
    var live = out && out.indexOf(edge) >= 0;
    return '<div class="w e' + edge + (live ? " live" : "") + '"><span>' + esc(card.words[i]) + "</span></div>";
  }).join("");
  return (
    '<div class="sc-face" data-spin="' + rot + '" data-spinkey="' + esc(key) + '">' +
    words + '<span class="sc-hole"></span></div>'
  );
}

function boardHTML(o) {
  var locked = o.locked || [false, false, false, false];
  var slotAct = o.slotAction || "slot", pullAct = o.pullAction || "pull";
  var slots = [0, 1, 2, 3].map(function (slot) {
    var p = o.placed[slot];
    var state = o.correct ? (o.correct[slot] ? "ok" : "no") : locked[slot] ? "lock" : "";
    var inner;
    if (p) {
      inner =
        '<button class="sc-card ' + state + (o.correct ? " reveal" : "") + '" data-a="' + slotAct + '" data-v="' + slot +
        '"' + (o.readOnly ? " disabled" : "") + ">" +
        faceHTML(p.card, p.rot, OUT_EDGES[slot], "s" + slot) +
        (!o.readOnly && !locked[slot] ? '<span class="sc-turnhint">↻</span>' : "") +
        (o.correct ? '<span class="sc-verdict">' + (o.correct[slot] ? "○" : "×") + "</span>" : "") +
        "</button>" +
        (!o.readOnly && !locked[slot]
          ? '<button class="sc-pull" data-a="' + pullAct + '" data-v="' + slot + '" aria-label="카드 빼기">×</button>'
          : "");
    } else {
      inner =
        '<button class="sc-empty' + (o.picked ? " hot" : "") + '" data-a="' + slotAct + '" data-v="' + slot + '"' +
        (o.readOnly ? " disabled" : "") + ">" + (o.picked ? "여기" : "") + "</button>";
    }
    return '<div class="sc-slot s' + slot + '"><span class="sc-notch"></span>' + inner + "</div>";
  }).join("");

  var clues = [0, 1, 2, 3].map(function (i) {
    var cls = "sc-clue c" + i + (o.write ? " write" : "") +
      (o.editable ? " editable" : "") + (o.sel === i ? " sel" : "");
    var inner = "<span>" + esc(o.clues[i] || "") + "</span>";
    return o.editable
      ? '<button class="' + cls + '" data-a="pickClue" data-v="' + i + '">' + inner + "</button>"
      : '<div class="' + cls + '">' + inner + "</div>";
  }).join("");

  return (
    '<div class="sc-boardwrap"><div class="sc-board">' + cloverPlate() +
    '<span class="sc-stem"></span>' +
    (o.score != null
      ? '<div class="sc-center"><b>' + o.score + "</b></div>"
      : o.centerAction
      ? '<button class="sc-center sc-centerbtn" data-a="' + o.centerAction + '" aria-label="' +
        (o.centerLabel || "다시 뽑기") + '"><span>↻</span></button>'
      : "") +
    slots + clues + "</div></div>"
  );
}

/* ─────────── 렌더 후 처리: 회전 애니메이션 · 채팅 스크롤 ─────────── */
var spinPrev = {};
function afterRender() {
  var faces = root.querySelectorAll("[data-spin]");
  for (var i = 0; i < faces.length; i++) {
    (function (el) {
      var key = el.dataset.spinkey, now = +el.dataset.spin;
      var prev = spinPrev[key];
      if (prev != null && prev !== now) {
        var d = (((now - prev) % 4) + 4) % 4;
        el.style.transition = "none";
        el.style.transform = "rotate(" + -d * 90 + "deg)";
        void el.offsetHeight;
        el.style.transition = "";
        el.style.transform = "rotate(0deg)";
      }
      spinPrev[key] = now;
    })(faces[i]);
  }
  if (S.wantFocus) {
    S.wantFocus = false;
    var input = root.querySelector('[data-f="clue"]');
    if (input) input.focus();
  }
  var box = document.getElementById("sc-msgs");
  if (box) box.scrollTop = box.scrollHeight;
}

/* ═══════════════════════════════════════════════════════════════
   동작
   ═══════════════════════════════════════════════════════════════ */
function submitClues() {
  var r = S.room, vid = viewerId(), board = r.boards[vid];
  var pairs = pairWordsOf(board);
  S.checking = !!AI_ENDPOINT;
  S.errors = ["", "", "", ""];
  if (S.checking) render();

  var finish = function (verdict, down) {
    S.checking = false;
    S.aiDown = !!down;
    if (verdict.some(Boolean)) {
      S.errors = verdict;
      return notice("규칙에 어긋나는 단서가 있어요. 고친 뒤 다시 제출해 주세요.");
    }
    var clues = S.draft.map(function (d) { return d.trim().slice(0, 14); });
    S.draft = ["", "", "", ""];
    S.errors = ["", "", "", ""];
    S.clueIdx = 0;
    commit(function (s) {
      if (s.phase !== "clues" || !s.boards[vid] || s.boards[vid].submitted) return null;
      s.boards[vid].clues = clues;
      s.boards[vid].submitted = true;
      if (s.players.every(function (p) { return s.boards[p.id] && s.boards[p.id].submitted; })) {
        s.phase = "resolution";
        s.turnIndex = 0;
        s.round = makeRound(s, s.order[0]);
      }
      return s;
    });
  };

  checkClues(pairs, S.draft).then(function (res) { finish(res.verdict, !res.ai); });
}

function checkPlacement() {
  commit(function (s) {
    var r = s.round;
    if (!r || r.result || r.placement.some(function (q) { return !q; })) return null;
    var sol = s.boards[r.spectatorId].solution;
    var correct = r.placement.map(function (p, i) {
      return !!p && p.cardId === sol[i].cardId && p.rot === sol[i].rot;
    });
    if (r.attempt === 1 && correct.every(Boolean)) {
      r.result = { points: 6, perfect: true, correct: correct };
      s.results.push({ spectatorId: r.spectatorId, points: 6, correct: correct });
    } else if (r.attempt === 1) {
      correct.forEach(function (ok, i) {
        if (ok) r.locked[i] = true;
        else r.placement[i] = null;
      });
      r.attempt = 2;
    } else {
      var pts = correct.filter(Boolean).length;
      r.result = { points: pts, perfect: false, correct: correct };
      s.results.push({ spectatorId: r.spectatorId, points: pts, correct: correct });
    }
    return s;
  });
}

var legendMark = null;
function saveLegend() {
  var r = S.room;
  if (!r || r.phase !== "end") return;
  var mark = r.code + ":" + r.results.length + ":" + r.createdAt;
  if (legendMark === mark) return;   // 같은 판을 두 번 기록하지 않는다
  legendMark = mark;
  var total = r.results.reduce(function (a, x) { return a + x.points; }, 0);
  var max = r.order.length * 6;
  var list = readLegends();
  var prevBest = list.reduce(function (a, x) { return Math.max(a, x.total); }, 0);
  store.set(LEGEND_KEY, JSON.stringify([{ t: Date.now(), total: total, max: max, n: r.players.length }].concat(list).slice(0, 20)));
  S.legends = readLegends();
  S.endNote =
    list.length === 0
      ? "첫 기록을 남겼어요. 다음 판에 이 점수를 넘어보세요."
      : total > prevBest
      ? "최고 기록을 갈아치웠어요. 이전 기록은 " + prevBest + "점."
      : "지금까지 " + (list.length + 1) + "판. 최고 기록은 " + Math.max(prevBest, total) + "점이에요.";
}

var actions = {
  closeNotice: function () { S.notice = ""; render(); },
  ruleToggle: function () { S.ruleOpen = !S.ruleOpen; render(); },
  sheet: function (v) { S.sheet = v; render(); },
  closeSheet: function () { S.sheet = null; render(); },
  sound: function () {
    S.sound = !S.sound;
    store.set(SOUND_KEY, S.sound ? "on" : "off");
    if (S.sound) { wakeAudio(); chime(false); }
    render();
  },
  noop: function () {},
  go: function (v) { S.view = v; S.found = null; render(); },
  back: function () { S.view = "menu"; S.found = null; render(); },
  addLocal: function () { S.locals = S.locals.concat([""]); render(); },
  delLocal: function () { S.locals = S.locals.slice(0, -1); render(); },
  startLocal: startLocal,
  create: createRoom,
  resume: function () {
    if (!S.lastRoom) return;
    enterRoom(S.lastRoom.code, false);
  },
  join: joinRoom,
  copyInvite: copyInviteLink,
  leave: leaveRoom,
  ack: function (v) { S.acked = v; render(); },
  rename: function () { S.renaming = true; S.renameInput = (S.me && S.me.name) || ""; render(); },
  saveRename: function () {
    var nm = S.renameInput.trim().slice(0, 8);
    if (!nm) return;
    var person = saveMe(nm);
    S.renaming = false;
    commit(function (s) {
      var p = s.players.filter(function (x) { return x.id === person.id; })[0];
      if (!p || p.name === nm) return null;
      p.name = nm;
      return s;
    });
    render();
  },
  deck: function (v) {
    commit(function (s) {
      if (s.phase !== "lobby" || s.deck === v) return null;
      s.deck = v;
      return s;
    });
  },
  extra: function (v) {
    commit(function (s) {
      var n = +v;
      if (s.phase !== "lobby" || (s.extra || 1) === n) return null;
      s.extra = n;
      return s;
    });
  },
  start: function () {
    commit(function (s) {
      if (s.phase !== "lobby" || s.players.length < 2) return null;
      s.boards = buildBoards(s.players, s.deck, s.extra);
      s.order = shuffle(s.players.map(function (p) { return p.id; }));
      s.turnIndex = 0;
      s.results = [];
      s.round = null;
      s.phase = "clues";
      return s;
    });
  },
  kick: function (pid) {
    commit(function (s) {
      if (!s.players.some(function (p) { return p.id === pid; })) return null;
      s.players = s.players.filter(function (p) { return p.id !== pid; });
      delete s.boards[pid];
      if (s.hostId === pid && s.players[0]) s.hostId = s.players[0].id;
      repairState(s);
      return s;
    });
  },
  pickClue: function (v) { S.clueIdx = +v; S.wantFocus = true; render(); },
  prevClue: function () { S.clueIdx = (S.clueIdx + 3) % 4; S.wantFocus = true; render(); },
  nextClue: function () { S.clueIdx = (S.clueIdx + 1) % 4; S.wantFocus = true; render(); },
  submitClues: submitClues,
  pick: function (id) { S.picked = S.picked === id ? null : id; render(); },
  slot: function (v) {
    var slot = +v, r = S.room, round = r.round;
    if (!round || round.result) return;
    if (S.mode !== "local" && round.spectatorId === (S.me && S.me.id)) return;
    if (round.locked[slot]) return;
    if (round.placement[slot]) {
      commit(function (s) {
        var p = s.round && !s.round.result && s.round.placement[slot];
        if (!p || s.round.locked[slot]) return null;
        p.rot = (p.rot + 1) % 4;
        return s;
      });
    } else if (S.picked) {
      var card = S.picked;
      S.picked = null;
      commit(function (s) {
        var rr = s.round;
        if (!rr || rr.result || rr.placement[slot]) return null;
        if (rr.placement.some(function (q) { return q && q.cardId === card; })) return null;
        rr.placement[slot] = { cardId: card, rot: 0 };
        return s;
      });
    }
  },
  pull: function (v) {
    var slot = +v;
    commit(function (s) {
      if (!s.round || s.round.result || s.round.locked[slot] || !s.round.placement[slot]) return null;
      s.round.placement[slot] = null;
      return s;
    });
  },
  check: checkPlacement,
  next: function () {
    var at = S.room.turnIndex;
    commit(function (s) {
      if (s.phase !== "resolution" || !(s.round && s.round.result) || s.turnIndex !== at) return null;
      var i = s.turnIndex + 1;
      if (i >= s.order.length) {
        s.phase = "end";
        s.round = null;
      } else {
        s.turnIndex = i;
        s.round = makeRound(s, s.order[i]);
      }
      return s;
    }).then(function () {
      if (S.room && S.room.phase === "end") saveLegend();
      S.acked = null;
    });
  },
  review: function (v) { S.review = v; render(); },
  closeReview: function () { S.review = null; render(); },
  again: function () {
    S.endNote = "";
    S.review = null;
    commit(function (s) {
      if (s.phase !== "end") return null;
      s.phase = "lobby";
      s.boards = {};
      s.order = [];
      s.turnIndex = 0;
      s.round = null;
      s.results = [];
      return s;
    });
  },
  send: function () {
    var t = S.chatInput.trim().slice(0, 120);
    if (!t || !S.me) return;
    S.chatInput = "";
    commit(function (s) {
      s.chat = (s.chat || []).concat([{ id: uid(), by: S.me.id, name: S.me.name, text: t, t: Date.now() }]).slice(-60);
      return s;
    });
  },

  /* ── 연습모드: 방/서버 없이 혼자, 메모리에서만 ── */
  practiceEnter: function () {
    S.view = "practice";
    S.pPhase = "clue";
    S.pBoard = makePracticeBoard(S.pDeck, S.pExtra);
    S.pRound = null;
    S.draft = ["", "", "", ""];
    S.errors = ["", "", "", ""];
    S.clueIdx = 0;
    S.picked = null;
    render();
  },
  practiceDeck: function (v) {
    if (S.pPhase !== "clue") return;
    S.pDeck = v;
    S.pBoard = makePracticeBoard(S.pDeck, S.pExtra);
    S.draft = ["", "", "", ""];
    S.errors = ["", "", "", ""];
    S.clueIdx = 0;
    render();
  },
  practiceExtra: function (v) {
    if (S.pPhase !== "clue") return;
    S.pExtra = +v;
    S.pBoard = makePracticeBoard(S.pDeck, S.pExtra);
    S.draft = ["", "", "", ""];
    S.errors = ["", "", "", ""];
    S.clueIdx = 0;
    render();
  },
  practiceSubmit: function () {
    var pairs = pairWordsOf(S.pBoard);
    var verdict = basicJudge(pairs, S.draft);
    S.errors = ["", "", "", ""];
    if (verdict.some(Boolean)) {
      S.errors = verdict;
      return notice("규칙에 어긋나는 단서가 있어요. 고친 뒤 다시 확인해 보세요.");
    }
    S.pBoard.clues = S.draft.map(function (d) { return d.trim().slice(0, 14); });
    S.draft = ["", "", "", ""];
    S.errors = ["", "", "", ""];
    S.pRound = makePracticeRound(S.pBoard);
    S.pPhase = "guess";
    S.picked = null;
    render();
  },
  practicePick: function (id) { S.picked = S.picked === id ? null : id; render(); },
  practiceSlot: function (v) {
    var slot = +v, r = S.pRound;
    if (!r || r.result || r.locked[slot]) return;
    if (r.placement[slot]) {
      r.placement[slot].rot = (r.placement[slot].rot + 1) % 4;
      render();
    } else if (S.picked) {
      if (r.placement.some(function (q) { return q && q.cardId === S.picked; })) return;
      r.placement[slot] = { cardId: S.picked, rot: 0 };
      S.picked = null;
      render();
    }
  },
  practicePull: function (v) {
    var slot = +v, r = S.pRound;
    if (!r || r.result || r.locked[slot] || !r.placement[slot]) return;
    r.placement[slot] = null;
    render();
  },
  practiceCheck: function () {
    var r = S.pRound;
    if (!r || r.result || r.placement.some(function (q) { return !q; })) return;
    var sol = S.pBoard.solution;
    var correct = r.placement.map(function (p, i) {
      return !!p && p.cardId === sol[i].cardId && p.rot === sol[i].rot;
    });
    if (r.attempt === 1 && correct.every(Boolean)) {
      r.result = { points: 6, perfect: true, correct: correct };
    } else if (r.attempt === 1) {
      correct.forEach(function (ok, i) {
        if (ok) r.locked[i] = true; else r.placement[i] = null;
      });
      r.attempt = 2;
    } else {
      r.result = { points: correct.filter(Boolean).length, perfect: false, correct: correct };
    }
    render();
  },
  practiceAgain: function () { actions.practiceEnter(); },
  practiceExit: function () {
    S.view = "menu";
    S.pPhase = null;
    S.pBoard = null;
    S.pRound = null;
    render();
  },
};

/* ─────────── 이벤트 위임 ─────────── */
function bind() {
  root.addEventListener("click", function (e) {
    wakeAudio();
    var el = e.target.closest("[data-a]");
    if (!el || el.disabled) return;
    var fn = actions[el.dataset.a];
    if (fn) fn(el.dataset.v);
  });

  root.addEventListener("input", function (e) {
    var el = e.target;
    var kind = el.dataset && el.dataset.in;
    if (!kind) return;
    if (kind === "name") {
      S.nameInput = el.value;
      var cbtn = root.querySelector('[data-a="create"]') || root.querySelector('[data-a="join"]');
      if (cbtn) {
        var isJoin = cbtn.dataset.a === "join";
        var rOk = S.found && S.found !== "searching" && S.found !== "none";
        cbtn.disabled = !el.value.trim() || (isJoin && !rOk);
      }
    }
    else if (kind === "rename") S.renameInput = el.value;
    else if (kind === "local") S.locals[+el.dataset.i] = el.value;
    else if (kind === "draft") {
      var idx = +el.dataset.i;
      S.draft[idx] = el.value;
      var strip = root.querySelector(".sc-clue.c" + idx + " span");
      if (strip) strip.textContent = el.value;
      var dot = root.querySelectorAll(".sc-dot")[idx];
      if (dot) dot.classList.toggle("done", !!el.value.trim());
      if (S.errors[idx]) {
        S.errors[idx] = "";
        el.classList.remove("bad");
        if (dot) dot.classList.remove("bad");
        var er = root.querySelector(".sc-editor .sc-err");
        if (er) er.remove();
      }
      var btn = root.querySelector('[data-a="submitClues"]') || root.querySelector('[data-a="practiceSubmit"]');
      if (btn) {
        var all = S.draft.every(function (d) { return d.trim().length; });
        btn.disabled = !all;
        btn.textContent = all
          ? (btn.dataset.a === "practiceSubmit" ? "다 썼으면 직접 맞혀보기" : "단서 제출")
          : "네 칸을 모두 채우세요";
      }
      lastHTML = "";   // 직접 손댔으니 다음 render 는 반드시 다시 그린다
    } else if (kind === "chat") {
      S.chatInput = el.value;
      var sbtn = root.querySelector('[data-a="send"]');
      if (sbtn) sbtn.disabled = !el.value.trim();
    } else if (kind === "code") {
      el.value = el.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      S.codeInput = el.value;
      lookupRoom();
    }
  });

  root.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var kind = e.target.dataset && e.target.dataset.in;
    if (kind === "chat") actions.send();
    if (kind === "rename") actions.saveRename();
    if (kind === "draft") {
      e.preventDefault();
      var empty = -1;
      for (var n = 1; n <= 4; n++) {
        var k = (S.clueIdx + n) % 4;
        if (!S.draft[k].trim()) { empty = k; break; }
      }
      if (empty >= 0) actions.pickClue(empty);
      else if (S.view === "practice") actions.practiceSubmit();
      else submitClues();
    }
  });
}

var lookupTimer = null;
function lookupRoom() {
  clearTimeout(lookupTimer);
  if (S.codeInput.length !== 4) {
    S.found = null;
    return render();
  }
  S.found = "searching";
  render();
  lookupTimer = setTimeout(function () {
    var c = S.codeInput;
    net.read(c).then(function (r) {
      if (S.codeInput !== c) return;
      S.found = r || "none";
      render();
    });
  }, 300);
}

/* ─────────── 시작 ─────────── */
function boot() {
  root = document.getElementById("root");
  loadMe();
  S.sound = store.get(SOUND_KEY) !== "off";
  S.legends = readLegends();
  S.lastRoom = readLastRoom();
  bind();

  var invite = readInviteCode();
  if (invite) {
    try { history.replaceState(null, "", location.pathname + location.hash); } catch (e) {}
    S.codeInput = invite;
    S.view = "join";
    if (S.me && S.me.name) {
      enterRoom(invite, false);
    } else {
      lookupRoom();
    }
  }

  render();
  if (FIREBASE_CONFIG) {
    makeFirebaseNet()
      .then(function (fb) {
        if (fb) { net = fb; window.__fbNet = fb; }
      })
      .catch(function () {
        notice("Firebase 에 연결하지 못했어요. 같은 브라우저 안에서만 방이 보입니다.");
      });
  }
}
boot();

</script>
