<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쏘 클로버</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gothic+A1:wght@400;500;700;900&family=Jua&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#184B46;-webkit-text-size-adjust:100%}
#root{min-height:100dvh}
.sc-root{min-height:100dvh}
.sc-root{
  --green:#2E7D32; --green-d:#1F5C24; --green-l:#66BB6A; --leaf:#8FD694;
  --board:#2F7D3A; --board-d:#256230;
  --ivory:#FCF6E7; --card:#FFFDF6; --ink:#2A2E26; --dim:#5F6B5C;
  --gold:#FFC93C; --red:#D4483B; --line:#1F5C24;
  --r-lg:18px; --r-md:13px; --r-sm:9px;
  --lift:0 5px 0 rgba(0,0,0,.16);
  --lift-lg:0 6px 0 rgba(0,0,0,.16),0 14px 24px rgba(0,0,0,.2);
  --panel:rgba(255,255,255,.10);
  --hair:1px solid rgba(255,255,255,.14);
  --cardsize: clamp(78px, 21.5vw, 104px);
  --cluew: clamp(72px, 20vw, 94px);
  min-height:100vh; color:var(--ink);
  font-family:'Gothic A1',system-ui,sans-serif;
  word-break:keep-all; overflow-wrap:break-word;
  background-color:#184B46;
  background-image:
    radial-gradient(circle at 50% -8%, #23716A 0%, #184B46 54%, #113732 100%);
  padding:16px 14px 60px;
}
.sc-root *{box-sizing:border-box}
.sc-root button:focus-visible,.sc-root input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sc-wrap{max-width:440px;margin:0 auto}
.sc-h2{font-family:'Jua',sans-serif;font-size:20px;color:#fff;margin:16px 0 6px;font-weight:400}
.sc-dim{color:#D8EAE6;font-size:14px;line-height:1.7;margin:6px 0 14px}
.sc-tight{margin:0 0 10px}
.sc-wait{background:var(--panel);border:1px dashed rgba(255,255,255,.42);color:#fff;
  padding:14px;border-radius:var(--r-md);font-size:14px;margin:14px 0}

/* 홈 */
.sc-home{padding-top:6px}
.sc-chev{color:#B9B09A;font-size:20px;line-height:1}

.sc-form{background:var(--ivory);border-radius:var(--r-lg);padding:16px 16px 20px;margin-top:14px;
  box-shadow:var(--lift)}
.sc-form h2{font-family:'Jua',sans-serif;font-weight:400;font-size:20px;color:var(--green-d);margin:6px 0 4px}
.sc-back{background:transparent;border:0;padding:0;color:var(--dim);font-family:inherit;font-size:13px;cursor:pointer}
.sc-back.sc-backw{color:#EAF3E0;opacity:.85}
.sc-back.sc-backw:hover{opacity:1}
.sc-formdim{font-size:13px;color:var(--dim);line-height:1.7;margin:0 0 12px}
.sc-warn{background:#FFF3D6;border-left:4px solid var(--gold);border-radius:var(--r-sm);padding:10px 11px;
  font-size:13px;color:#6B5410;line-height:1.6;margin:10px 0 14px}
.sc-label{display:block;font-size:12px;font-weight:700;color:var(--dim);margin:12px 0 6px}
.sc-input{width:100%;padding:12px 14px;border:2px solid #DDD3B8;border-radius:var(--r-sm);background:#fff;
  font-family:inherit;font-size:16px;color:var(--ink)}
.sc-input.bad{border-color:var(--red);background:#FFF4F2}
.sc-stack{margin-bottom:8px}
.sc-codein{font-family:'Jua',sans-serif;font-size:26px;letter-spacing:.3em;text-align:center;padding-left:.3em}
.sc-row{display:flex;gap:8px;margin-top:4px}
.sc-mini-btn{flex:1;padding:9px;border:2px dashed #CFC3A4;border-radius:var(--r-sm);background:transparent;
  font-family:inherit;font-size:13px;color:var(--dim);cursor:pointer}
.sc-mini-btn:disabled{opacity:.4;cursor:not-allowed}
.sc-btn{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:var(--r-md);
  background:var(--gold);color:#3A2C00;font-family:'Jua',sans-serif;font-size:17px;cursor:pointer;
  box-shadow:0 5px 0 #C99A16;transition:transform .07s,box-shadow .07s}
.sc-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #C99A16}
.sc-btn:disabled{background:#CFC9B8;color:#7C776B;box-shadow:0 5px 0 #A9A496;cursor:not-allowed}
.sc-btn-alt{background:#fff;color:var(--green-d);box-shadow:0 5px 0 #C6BCA0;margin-top:10px;font-size:15px}
.sc-found{min-height:20px;margin:8px 2px 0;font-size:13px;line-height:1.5}
.sc-fdim{color:var(--dim)}
.sc-fbad{color:var(--red)}
.sc-fok{color:var(--green)}
.sc-mt{margin-top:14px}
.sc-mb{margin-bottom:12px}
.sc-light{border-color:#CFC3A4;color:var(--green-d);background:var(--ivory);margin-bottom:6px}

/* 헤더 */
.sc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sc-headright{display:flex;align-items:center;gap:8px}
.sc-ghost{background:transparent;border:0;color:#C9E0DB;font-family:inherit;font-size:13px;cursor:pointer;padding:4px 0}
.sc-roomcode{font-family:'Jua',sans-serif;font-size:17px;letter-spacing:.22em;background:var(--ivory);
  color:var(--green-d);padding:5px 10px 5px 14px;border-radius:var(--r-sm)}
.sc-bell{border:0;background:rgba(255,255,255,.14);border-radius:50%;width:32px;height:32px;
  font-size:15px;line-height:1;cursor:pointer;padding:0}
.sc-bell.off{opacity:.5}
.sc-tagpill{font-size:12px;background:rgba(255,255,255,.2);color:#fff;padding:6px 11px;border-radius:20px}

/* 로비 */
.sc-players{list-style:none;padding:0;margin:0 0 14px}
.sc-players li{display:flex;align-items:center;gap:9px;padding:12px 14px;background:var(--ivory);
  border-radius:var(--r-md);margin-bottom:7px;font-size:15px;font-weight:500}
.sc-leafdot{width:10px;height:10px;background:var(--green-l);border-radius:50% 0 50% 50%}
.sc-badge{font-style:normal;font-size:12px;background:var(--green);color:#fff;padding:2px 7px;
  border-radius:8px;margin-left:auto}
.sc-badge.me{background:var(--gold);color:#3A2C00;margin-left:6px}

/* 클로버 보드 */
.sc-boardwrap{display:flex;justify-content:center;margin:16px 0 22px}
.sc-home .sc-boardwrap{margin:10px 0 16px}
.sc-board{position:relative;
  width:calc(var(--cardsize)*2 + 34px + 108px);
  height:calc(var(--cardsize)*2 + 34px + 108px)}
.sc-plate{position:absolute;inset:0;width:100%;height:100%;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.32))}
.sc-stem{position:absolute;left:50%;bottom:-16px;width:9px;height:42px;border-radius:5px;
  background:#2C8637;transform:translateX(-50%) rotate(7deg);
  box-shadow:inset -2px 0 0 rgba(0,0,0,.18);z-index:-1}
.sc-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:calc(34px + 14px);height:calc(34px + 14px);border-radius:50%;background:#F7F9F2;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:1}
.sc-center b{font-family:'Gaegu',cursive;font-size:24px;color:#1F2A1E;transform:rotate(-6deg)}
.sc-centerbtn{border:none;padding:0;margin:0;font:inherit;cursor:pointer;transition:transform .15s,background .15s}
.sc-centerbtn span{font-size:18px;color:#2C8637;line-height:1}
.sc-centerbtn:hover{background:#EEF3E4}
.sc-centerbtn:active{transform:translate(-50%,-50%) scale(.9)}

.sc-slot{position:absolute;width:var(--cardsize);height:var(--cardsize);z-index:2}
.sc-slot.s0{left:54px;top:54px}
.sc-slot.s1{right:54px;top:54px}
.sc-slot.s2{right:54px;bottom:54px}
.sc-slot.s3{left:54px;bottom:54px}
.sc-notch{position:absolute;inset:-6px;background:#2C8637;border-radius:11px;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.38)}

.sc-card,.sc-empty{position:absolute;inset:0;width:100%;height:100%;padding:0;cursor:pointer;
  border-radius:7px;font-family:inherit}
.sc-card{background:#FFFDF4;border:1px solid #E6DCC2;
  box-shadow:0 2px 5px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.9);
  animation:sc-drop .28s cubic-bezier(.2,.9,.3,1.2)}
.sc-card.reveal{animation:sc-drop .34s cubic-bezier(.2,.9,.3,1.2) backwards}
.s0 .sc-card.reveal{animation-delay:0s}
.s1 .sc-card.reveal{animation-delay:.13s}
.s2 .sc-card.reveal{animation-delay:.26s}
.s3 .sc-card.reveal{animation-delay:.39s}
@keyframes sc-drop{from{transform:translateY(-14px) scale(1.08);opacity:0}to{transform:none;opacity:1}}
.sc-card:disabled,.sc-empty:disabled{cursor:default}
.sc-card:not(:disabled):active{transform:scale(.965)}
.sc-card.ok{box-shadow:0 0 0 3px var(--gold),0 2px 5px rgba(0,0,0,.35)}
.sc-card.no{opacity:.62}
.sc-card.lock{background:#F4F8EC}
.sc-empty{background:rgba(16,64,26,.34);border:2px dashed rgba(255,255,255,.45);border-radius:7px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.28);color:rgba(255,255,255,.82);
  font-family:'Jua',sans-serif;font-size:12px}
.sc-empty.hot{background:rgba(255,201,60,.92);border-style:solid;border-color:#fff;color:#3A2C00;
  animation:sc-pulse 1s ease-in-out infinite}
@keyframes sc-pulse{0%,100%{opacity:.92}50%{opacity:.65}}
.sc-pull{position:absolute;top:-9px;right:-9px;width:23px;height:23px;border:0;border-radius:50%;
  background:var(--ink);color:#fff;font-size:13px;line-height:1;cursor:pointer;padding:0;z-index:4}
.sc-turnhint{position:absolute;right:3px;bottom:2px;font-size:10px;color:#C6BCA0;pointer-events:none}
.sc-verdict{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Jua',sans-serif;font-size:34px;color:rgba(46,125,50,.9);pointer-events:none}
.sc-card.no .sc-verdict{color:rgba(212,72,59,.85)}

/* 카드면 — 통째로 회전 */
.sc-face{position:absolute;inset:0;font-family:'Jua',sans-serif;font-size:10.5px;color:#A9A08A;
  transition:transform .38s cubic-bezier(.25,.9,.3,1.05)}
.sc-face.snap{transition:none}
.sc-face .w{position:absolute;display:flex;align-items:center;justify-content:center;
  transition:none}
.sc-face .w span{transition:transform .24s ease .04s;white-space:nowrap;display:block}
.sc-face .w.live{color:var(--ink);font-size:12.5px}
.sc-face .e0{top:4px;left:0;right:0;height:20px}
.sc-face .e2{bottom:4px;left:0;right:0;height:20px}
.sc-face .e1{right:4px;top:0;bottom:0;width:20px}
.sc-face .e3{left:4px;top:0;bottom:0;width:20px}
.sc-face .e1 span{transform:rotate(90deg)}
.sc-face .e3 span{transform:rotate(-90deg)}
.sc-hole{position:absolute;left:50%;top:50%;width:26%;height:26%;transform:translate(-50%,-50%);
  border-radius:4px;background:#2F8B3A;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}

.sc-clue{position:absolute;width:var(--cluew);height:27px;display:flex;align-items:center;
  justify-content:center;background:#FBFDF7;border-radius:5px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.24),0 1px 0 rgba(255,255,255,.45);
  font-family:'Gaegu',cursive;font-weight:700;font-size:17px;color:#20301E;padding:2px 5px;
  text-align:center;word-break:keep-all;line-height:1.1;overflow:hidden;z-index:1}
.sc-clue span{transform:rotate(-1.5deg)}
.sc-clue.write span{animation:sc-write .55s cubic-bezier(.3,.7,.4,1) backwards}
.sc-clue.c0.write span{animation-delay:.15s}
.sc-clue.c1.write span{animation-delay:.32s}
.sc-clue.c2.write span{animation-delay:.49s}
.sc-clue.c3.write span{animation-delay:.66s}
@keyframes sc-write{
  from{clip-path:inset(0 100% 0 0);opacity:.35}
  to{clip-path:inset(0 0 0 0);opacity:1}}
.sc-clue.c0{top:25px;left:50%;transform:translateX(-50%)}
.sc-clue.c2{bottom:25px;left:50%;transform:translateX(-50%)}
.sc-clue.c1{right:calc(38px - var(--cluew)/2);top:50%;transform:translateY(-50%) rotate(90deg)}
.sc-clue.c3{left:calc(38px - var(--cluew)/2);top:50%;transform:translateY(-50%) rotate(-90deg)}

/* 단서 입력 */
.sc-clues{margin-top:4px}
.sc-pair{font-size:15px;margin-bottom:7px;display:flex;align-items:center;gap:7px;word-break:keep-all}
.sc-pos{font-size:12px;background:var(--green);color:#fff;padding:2px 7px;border-radius:8px}
.sc-plus{color:var(--green-l);font-weight:700}
.sc-marker{font-family:'Gaegu',cursive;font-size:20px}
.sc-err{color:var(--red);font-size:13px;margin:7px 2px 0;line-height:1.5}

/* 해결 */
.sc-turnbar{display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:rgba(0,0,0,.24);color:#DCEDE9;padding:10px 13px;border-radius:var(--r-md);font-size:12px;margin-top:10px}
.sc-turnbar strong{font-family:'Jua',sans-serif;font-weight:400;font-size:15px;color:#fff}
.sc-hush{background:var(--gold);border-radius:var(--r-md);padding:15px;margin:14px 0}
.sc-hush h2{font-family:'Jua',sans-serif;font-weight:400;font-size:20px;margin:0 0 6px;color:#3A2C00}
.sc-hush p{margin:0;font-size:14px;color:#5A4508;line-height:1.6}
.sc-tray{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:4px 0}
.sc-traycard{border:0;background:transparent;padding:0;cursor:pointer;border-radius:10px}
.sc-traycard.picked{outline:3px solid var(--gold);outline-offset:2px}
.sc-minicard{position:relative;width:84px;height:84px;background:#FFFDF4;border-radius:7px;
  border:1px solid #E6DCC2;box-shadow:0 2px 5px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.9)}
.sc-minicard .sc-face{font-size:10px;color:var(--ink)}
.sc-minicard .sc-face .e0,.sc-minicard .sc-face .e2{height:17px}
.sc-minicard .sc-face .e1,.sc-minicard .sc-face .e3{width:17px}
.sc-minicard .sc-hole{width:24%;height:24%;background:#1B554E}
.sc-result{margin-top:6px}
.sc-score{font-family:'Jua',sans-serif;font-size:34px;color:#fff;margin:8px 0 0}
.sc-score em{display:block;font-style:normal;font-family:'Gothic A1';font-size:13px;color:var(--gold);font-weight:700}

/* 결과 */
.sc-bigscore{display:flex;align-items:baseline;gap:8px;color:#fff;margin:6px 0 14px}
.sc-bigscore span{font-family:'Jua',sans-serif;font-size:62px;line-height:1}
.sc-bigscore em{font-style:normal;font-size:17px;color:#BFDAD5}
.sc-tally{list-style:none;padding:0;margin:0 0 14px}
.sc-tally li{margin-bottom:7px}
.sc-tally button{display:flex;align-items:center;width:100%;padding:12px 14px;background:var(--ivory);
  border:0;border-radius:var(--r-md);font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.sc-tally button span{flex:1;text-align:left;font-weight:500}
.sc-tally button b{font-family:'Jua',sans-serif;font-weight:400;font-size:16px;color:var(--green-d)}
.sc-tally button i{font-style:normal;margin-left:8px}
.sc-tally button:active{transform:scale(.99)}

/* 지난 판 다시 보기 */
.sc-reviewhead{display:flex;align-items:center;gap:10px;margin:8px 0 2px}
.sc-reviewhead div{flex:1;text-align:center;color:#fff}
.sc-reviewhead b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:19px}
.sc-reviewhead em{font-style:normal;font-size:13px;color:var(--gold);font-weight:700}
.sc-pairlist{list-style:none;margin:4px 0 0;padding:0}
.sc-pairlist li{display:flex;align-items:center;gap:7px;padding:11px 13px;background:var(--panel);
  border:var(--hair);border-radius:var(--r-md);margin-bottom:7px;color:#fff;font-size:14px;flex-wrap:wrap}
.sc-pairlist b{font-family:'Jua',sans-serif;font-weight:400;font-size:16px}
.sc-pairlist i{font-style:normal;color:var(--green-l)}
.sc-pairlist em{margin-left:auto;font-style:normal;font-family:'Gaegu',cursive;font-size:19px;
  color:#FFFDF6;background:rgba(0,0,0,.25);border-radius:6px;padding:2px 11px}

/* 게임 설명 */
.sc-howto{margin-top:14px;background:var(--panel);border:var(--hair);border-radius:var(--r-lg);overflow:hidden}
.sc-howhead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:transparent;border:0;padding:14px 16px;cursor:pointer;color:#fff;
  font-family:'Jua',sans-serif;font-size:17px}
.sc-howhead em{font-style:normal;font-family:'Gothic A1';font-size:12px;color:#BFDAD5}
.sc-step{flex:none;width:25px;height:25px;border-radius:50%;background:var(--gold);color:#3A2C00;
  font-family:'Jua',sans-serif;font-size:14px;display:flex;align-items:center;justify-content:center}
/* 보드에서 고르고 한 칸만 적는 단서 입력 */
.sc-clue.editable{border:0;cursor:pointer;padding:2px 5px;font-family:'Gaegu',cursive}
.sc-clue.editable span:empty:before{content:"단서";color:#AFC0AC}
.sc-clue.sel{box-shadow:inset 0 2px 4px rgba(0,0,0,.24),0 0 0 3px var(--gold)}
.sc-editor{background:var(--ivory);border-radius:var(--r-md);padding:12px}
.sc-editnav{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sc-arrow{flex:none;width:32px;height:32px;border:0;border-radius:50%;background:#EDE6D3;
  color:var(--green-d);font-size:20px;line-height:1;cursor:pointer;font-family:inherit}
.sc-arrow:active{background:#E0D7BE}
.sc-editpair{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:15px;word-break:keep-all;text-align:center}
.sc-editpair b{font-family:'Jua',sans-serif;font-weight:400;font-size:17px}
.sc-dots{display:flex;justify-content:center;gap:8px;margin-top:11px}
.sc-dot{width:11px;height:11px;padding:0;border:2px solid #D5CBAF;border-radius:50%;
  background:transparent;cursor:pointer}
.sc-dot.done{background:var(--green-l);border-color:var(--green-l)}
.sc-dot.on{box-shadow:0 0 0 3px rgba(255,201,60,.55)}
.sc-dot.bad{background:var(--red);border-color:var(--red)}

.sc-rulecard{margin:14px 0 0;background:var(--panel);border:var(--hair);border-radius:var(--r-lg);overflow:hidden}
.sc-rulecard .sc-howhead{padding:12px 15px;font-size:15px}
.sc-rulebody{padding:0 15px 12px}
.sc-rulebody .sc-howmeta{margin:0 !important}
.sc-rulelist{list-style:none;margin:2px 0 10px;padding:0}
.sc-rulelist li{position:relative;padding-left:13px;color:#D8EAE6;font-size:14px;line-height:1.65;margin-bottom:5px}
.sc-rulelist li:before{content:"·";position:absolute;left:2px;color:var(--gold)}
.sc-rulelist em{font-style:normal;display:inline-block;margin-left:5px;font-size:12px;color:#BFDCBD;
  background:rgba(0,0,0,.2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.sc-howmeta{color:#B9D8B7 !important;font-size:12px !important;margin-bottom:0 !important}

/* 전설의 기록 */
.sc-legends{margin-top:14px;background:var(--panel);border:var(--hair);border-radius:var(--r-lg);padding:13px 16px 15px}
.sc-ldate{width:58px;flex:none;font-size:12px;color:#BFDAD5}
.sc-lbar{flex:1;height:9px;border-radius:5px;background:rgba(0,0,0,.22);overflow:hidden}
.sc-lbar i{display:block;height:100%;border-radius:5px;background:#8FD694}

/* 점수판 */
.sc-scorebar{display:flex;align-items:center;gap:10px;background:var(--ivory);border-radius:var(--r-md);
  padding:10px 13px;margin:10px 0 6px}
.sc-scorenum{display:flex;align-items:baseline;gap:4px;color:var(--green-d)}
.sc-scorenum b{font-family:'Jua',sans-serif;font-weight:400;font-size:26px;line-height:1}
.sc-scorenum span{font-size:12px;color:var(--dim)}
.sc-pips{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.sc-pip{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Jua',sans-serif;font-size:12px;color:#fff;background:#C9C2AE}
.sc-pip.todo{background:#DDD6C2;color:#8A8371}
.sc-pip.now{background:var(--gold);color:#3A2C00;box-shadow:0 0 0 3px rgba(255,201,60,.35)}
.sc-pip.perfect{background:var(--green)}
.sc-pip.some{background:var(--green-l)}
.sc-pip.zero{background:var(--red)}
.sc-scoretail{font-size:12px;color:var(--dim);white-space:nowrap}

/* 넘기기 */
.sc-handoff{background:var(--ivory);border-radius:var(--r-lg);padding:30px 20px;text-align:center;margin-top:22px;
  box-shadow:var(--lift-lg)}
.sc-handoff h2{font-family:'Jua',sans-serif;font-weight:400;font-size:26px;margin:14px 0 8px;color:var(--green-d)}
.sc-handoff p{font-size:14px;color:var(--dim);line-height:1.7;margin:0}

/* 채팅 */
.sc-chat{margin-top:16px;background:var(--panel);border:var(--hair);border-radius:var(--r-lg);padding:13px}
.sc-chat h3{font-family:'Jua',sans-serif;font-weight:400;font-size:15px;color:#fff;margin:0 0 8px}
.sc-msgs{max-height:190px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.sc-msg{margin:0;background:rgba(255,255,255,.92);border-radius:var(--r-sm);padding:8px 11px;font-size:14px;
  color:var(--ink);align-self:flex-start;max-width:88%;word-break:break-word}
.sc-msg.mine{background:var(--gold);align-self:flex-end}
.sc-msg b{display:block;font-size:12px;color:var(--dim);font-weight:700;margin-bottom:1px}
.sc-sendrow{display:flex;gap:7px}
.sc-sendrow .sc-input{flex:1;padding:10px 12px;font-size:14px;border-radius:10px}
.sc-send{border:0;border-radius:var(--r-sm);background:var(--green-d);color:#fff;padding:0 15px;
  font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.sc-send:disabled{opacity:.5;cursor:not-allowed}
.sc-muted{background:rgba(0,0,0,.24);color:#DCEDE9;border-radius:var(--r-sm);padding:11px;font-size:13px;margin:0;text-align:center}

/* 알림 */
.sc-notice{position:sticky;top:8px;z-index:30;max-width:440px;margin:0 auto 10px;display:flex;gap:10px;
  align-items:flex-start;background:#22301F;color:#fff;padding:12px 13px;border-radius:var(--r-md);font-size:13px;line-height:1.55}
.sc-x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:18px;cursor:pointer;line-height:1;padding:0}

/* 홈 — 가로로 눕힌 히어로 */
.sc-hero{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r-lg);
  background:linear-gradient(170deg,#FFFDF6,#F4EEDD);
  box-shadow:var(--lift-lg),inset 0 0 0 2px rgba(255,255,255,.7)}

/* 선택지 타일 */
.sc-tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.sc-tile{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:14px;border:0;
  border-radius:var(--r-md);background:var(--ivory);box-shadow:var(--lift);cursor:pointer;
  text-align:left;font-family:inherit;transition:transform .07s,box-shadow .07s}
.sc-tileicon{width:24px;height:24px;margin-bottom:7px;border-radius:70% 22% 70% 70%}
.sc-tileicon.i1{background:var(--green-l)}
.sc-tileicon.i2{background:var(--gold)}
.sc-tileicon.i3{background:#8FD694}

/* 옆으로 넘기는 단계 */
.sc-guide{margin-top:16px}

/* 첫 화면 보드 — 카드가 곧 메뉴 */
.sc-board.home{--cardsize:clamp(70px, min(26vw, (100vw - 172px)/2), 118px)}
.sc-menucard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s,box-shadow .08s}
.sc-menucard b{font-family:'Jua',sans-serif;font-weight:400;font-size:15px;color:var(--green-d)}
.sc-menucard .sc-tileicon{margin:0;width:22px;height:22px}
.sc-menucard:active{transform:translateY(3px) scale(.985)}
.sc-board.home .sc-clue.c0 span{font-family:'Jua',sans-serif;font-size:17px;letter-spacing:-.5px}
.sc-tileicon.i4{background:#BFE0C2}
.sc-title{text-align:center;padding:14px 6px 2px}
.sc-title h1{font-family:'Jua',sans-serif;font-weight:400;font-size:46px;color:#FFFFFF;
  margin:0;letter-spacing:-1px;line-height:1.06;transform:rotate(-2deg);
  text-shadow:
    -2px -2px 0 #175A46, 2px -2px 0 #175A46, -2px 2px 0 #175A46, 2px 2px 0 #175A46,
    -3px 0 0 #175A46, 3px 0 0 #175A46, 0 -3px 0 #175A46, 0 3px 0 #175A46,
    0 7px 0 rgba(9,44,38,.55), 0 12px 18px rgba(0,0,0,.3)}
.sc-title h1 i{font-style:normal;color:#8FD694}
.sc-title p{margin:12px auto 0;max-width:300px;color:#D8EAE6;font-size:13.5px;line-height:1.65}
.sc-metachips{display:flex;justify-content:center;gap:6px;margin-top:11px}
.sc-metachips span{font-size:12px;color:#CFE6E1;background:rgba(255,255,255,.12);
  border-radius:20px;padding:4px 11px}
.sc-boardhint{margin:0;text-align:center;color:var(--gold);font-size:12.5px}

/* 기록 한 줄 */
.sc-leafdot.off{background:#7E8C88}
.sc-players li.away{opacity:.62}
.sc-badge.away{background:#7E8C88;color:#fff}
.sc-kick{width:24px;height:24px;margin-left:7px;border:0;border-radius:50%;background:#E4DCC6;
  color:#6B7268;font-size:14px;line-height:1;cursor:pointer;padding:0}
.sc-waitlist{list-style:none;margin:12px 0 0;padding:0}
.sc-waitlist li{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--panel);
  border:var(--hair);border-radius:var(--r-md);margin-bottom:7px;color:#fff;font-size:14px}
.sc-waitlist em{font-style:normal;margin-left:auto;font-size:12px;color:#BFDAD5}
.sc-waitlist .sc-mini-btn{flex:none;padding:6px 10px;font-size:12px;margin:0}
.sc-away{background:rgba(0,0,0,.22);border-radius:var(--r-sm);padding:10px 12px;margin:10px 0 0;
  color:#EBD9A6;font-size:13px;line-height:1.6}

.sc-deck{background:var(--panel);border:var(--hair);border-radius:var(--r-md);padding:12px 13px;margin-bottom:12px}
.sc-deckhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;
  color:#fff;font-family:'Jua',sans-serif;font-size:15px}
.sc-deckhead em{font-style:normal;font-family:'Gothic A1';font-size:13px;color:var(--gold);font-weight:700}
.sc-seg{display:flex;gap:6px}
.sc-seg button{flex:1;padding:9px 4px;border:0;border-radius:var(--r-sm);background:rgba(255,255,255,.14);
  color:#D8EAE6;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.sc-seg button.on{background:var(--gold);color:#3A2C00}
.sc-deckhint{margin:9px 0 0;color:#BFDAD5;font-size:12.5px;line-height:1.6}

.sc-resume{display:flex;align-items:center;gap:9px;width:100%;margin-top:12px;padding:12px 14px;
  border:0;border-radius:var(--r-md);background:var(--gold);color:#3A2C00;
  font-family:inherit;font-size:14px;cursor:pointer;box-shadow:var(--lift)}
.sc-resume b{flex:1;text-align:left;font-family:'Jua',sans-serif;font-weight:400;font-size:15px}
.sc-resume .sc-chev{color:#8A6E14}
.sc-resume:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.16)}

.sc-recordbar{display:flex;align-items:center;gap:9px;width:100%;margin-top:12px;padding:12px 14px;
  border:var(--hair);border-radius:var(--r-md);background:var(--panel);color:#fff;
  font-family:inherit;font-size:14px;cursor:pointer}
.sc-recordbar b{color:var(--gold);font-size:13px;font-weight:700}
.sc-recchips{margin-left:auto;display:flex;gap:4px}
.sc-recchips i{font-style:normal;font-size:12px;background:rgba(0,0,0,.22);border-radius:6px;
  padding:2px 7px;color:#D8EAE6}
.sc-recordbar .sc-chev{color:rgba(255,255,255,.6);font-size:18px}

/* 아래에서 올라오는 시트 */
.sc-sheetwrap{position:fixed;inset:0;z-index:40;background:rgba(6,30,27,.6);
  display:flex;align-items:flex-end;justify-content:center}
.sc-sheet{width:100%;max-width:440px;max-height:86dvh;overflow-y:auto;background:#184B46;
  border-radius:20px 20px 0 0;padding:10px 16px 22px;box-shadow:0 -8px 30px rgba(0,0,0,.35);
  animation:sc-up .22s ease}
@keyframes sc-up{from{transform:translateY(18px)}to{transform:none}}
.sc-grab{display:block;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);
  margin:2px auto 14px}
.sc-sheet h2{font-family:'Jua',sans-serif;font-weight:400;font-size:20px;color:#fff;margin:0 0 14px}
.sc-sheetsteps{list-style:none;margin:0;padding:0}
.sc-sheetsteps li{display:flex;gap:11px;margin-bottom:15px}
.sc-sheetsteps b{display:block;color:#fff;font-size:15px;margin-bottom:3px}
.sc-sheetsteps p{margin:0;color:#D8EAE6;font-size:14px;line-height:1.7}
.sc-sheetfoot{border-top:1px solid rgba(255,255,255,.22);padding-top:13px}
.sc-sheetfoot p{margin:0 0 8px;color:#D8EAE6;font-size:14px;line-height:1.7}
.sc-sheetfoot b{color:var(--gold);margin-right:5px}
.sc-legends-list{list-style:none;margin:0;padding:0}
.sc-legends-list li{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.sc-legends-list b{width:48px;text-align:right;font-size:13px;color:#DCEDE9;font-weight:700}
.sc-legends-list b.top{color:var(--gold)}

.sc-credit{margin:20px 0 4px;text-align:center;font-size:12px;letter-spacing:.14em;
  color:rgba(255,255,255,.55)}

@media (prefers-reduced-motion: reduce){
  .sc-root *{transition:none !important;animation:none !important}

var mem = {};

/* ─────────── 네트워크 어댑터 ─────────── */

    var s = document.createElement("script");

function makeFirebaseNet() {
  if (!FIREBASE_CONFIG) return Promise.resolve(null);
  var base = "https://www.gstatic.com/firebasejs/" + FIREBASE_VERSION + "/";
  return loadScript(base + "firebase-app-compat.js")
    .then(function () { return loadScript(base + "firebase-database-compat.js"); })
    .then(function () {

        write: function (s) { return ref(s.code).set(s).then(function () { return true; }); },
        subscribe: function (c, cb) {

/* 같은 브라우저 전용 (Firebase 미설정 시) */
var browserNet = {
  label: "browser",
  read: function (c) {
    var v = store.get(roomKey(c));
    try { return Promise.resolve(v ? JSON.parse(v) : null); } catch (e) { return Promise.resolve(null); }
  },
  write: function (s) {
    store.set(roomKey(s.code), JSON.stringify(s));
    return Promise.resolve(true);
  },
  subscribe: function (c, cb) {
    var alive = true;
    var tick = function () {
      if (!alive || document.hidden) return;
      browserNet.read(c).then(cb);
    };
    var wake = function () { if (!document.hidden) tick(); };
    tick();
    var id = setInterval(tick, 1500);
    window.addEventListener("storage", wake);
    document.addEventListener("visibilitychange", wake);
    window.addEventListener("focus", wake);
    return function () {
      alive = false;
      clearInterval(id);
      window.removeEventListener("storage", wake);
      document.removeEventListener("visibilitychange", wake);
      window.removeEventListener("focus", wake);
    };
  },
};

/* 로컬 플레이 — 메모리에만 */
function makeMemNet() {
  var state = null, listener = null;
  return {
    label: "mem",
    read: function () { return Promise.resolve(state); },
    write: function (s) {
      state = s;
      if (listener) listener(s);
      return Promise.resolve(true);
    },
    subscribe: function (_c, cb) {
      listener = cb;
      if (state) cb(state);
      return function () { listener = null; };

  var deck = makeDeck(level), boards = {};

    var four = deck.splice(0, 4), fakes = deck.splice(0, n), cards = {};
    four.concat(fakes).forEach(function (c) { cards[c.id] = c; });
    boards[p.id] = {
      cards: cards,
      solution: four.map(function (c) { return { cardId: c.id, rot: Math.floor(Math.random() * 4) }; }),
      extraIds: fakes.map(function (c) { return c.id; }),
      clues: ["", "", "", ""],
      submitted: false,

  });

}
/* 연습모드 — 혼자 쓰고 혼자 맞혀보는 보드 하나 (방/서버 없이 메모리에서만) */

  var deck = makeDeck(level);
  var four = deck.splice(0, 4), fakes = deck.splice(0, n), cards = {};
  four.concat(fakes).forEach(function (c) { cards[c.id] = c; });
  return {
    cards: cards,
    solution: four.map(function (c) { return { cardId: c.id, rot: Math.floor(Math.random() * 4) }; }),
    extraIds: fakes.map(function (c) { return c.id; }),
    clues: ["", "", "", ""],

}
function makePracticeRound(board) {
  return {
    pool: shuffle(board.solution.map(function (s) { return s.cardId; }).concat(board.extraIds || [])),
    placement: [null, null, null, null],
    locked: [false, false, false, false],

}
function makeRound(state, spectatorId) {

  return {
    spectatorId: spectatorId,
    pool: shuffle(b.solution.map(function (s) { return s.cardId; })
      .concat(b.extraIds || (b.extraId ? [b.extraId] : []))),
    placement: [null, null, null, null],
    locked: [false, false, false, false],
    attempt: 1,
    result: null,

}
function pairWordsOf(board) {
  var placed = board.solution.map(function (s) { return { card: board.cards[s.cardId], rot: s.rot }; });
  return CLUE_PAIRS.map(function (pair) {
    return pair.map(function (pe) { return wordAt(placed[pe[0]].card, placed[pe[0]].rot, pe[1]); });
  });

/* 서로 다른 기기가 동시에 조작해 상태가 어긋나면 방장 기기가 조용히 바로잡는다 */
function repairState(s) {
  var changed = false;
  if (s.players.length && !s.players.some(function (p) { return p.id === s.hostId; })) {
    s.hostId = s.players[0].id;
    changed = true;
  }
  if (s.phase === "lobby" || !s.order) return changed;

  var alive = s.order.filter(function (id) { return s.players.some(function (p) { return p.id === id; }); });
  if (alive.length !== s.order.length) {
    s.results = s.results.filter(function (r) { return alive.indexOf(r.spectatorId) >= 0; });
    s.order = alive;
    s.turnIndex = Math.min(s.turnIndex, Math.max(alive.length - 1, 0));
    changed = true;
  }
  if (!s.order.length) {
    s.phase = "lobby";
    s.round = null;
    return true;
  }
  if (s.phase === "clues" && s.players.every(function (p) { return s.boards[p.id] && s.boards[p.id].submitted; })) {
    s.phase = "resolution";
    s.turnIndex = 0;
    s.round = makeRound(s, s.order[0]);
    changed = true;
  }
  if (s.phase === "resolution") {
    if (!s.round || !s.players.some(function (p) { return p.id === s.round.spectatorId; })) {
      var i = Math.min(s.turnIndex, s.order.length - 1);
      s.turnIndex = i;
      s.round = makeRound(s, s.order[i]);
      changed = true;
    }
  }
  return changed;
}

}

/* ─────────── AI 단서 심판 ─────────── */
function judgeClues(pairs, clues) {
  var items = clues.map(function (c, i) { return { i: i, keywords: pairs[i], clue: c.trim() }; });

    '당신은 보드게임 "쏘 클로버"의 단서 심판입니다. 아래 각 항목은 키워드 두 개와 플레이어가 적은 단서입니다.\n\n' +
    "다음 네 가지 위반만 잡아내세요.\n" +

    "2. 단서가 키워드 중 하나와 같거나, 그 키워드의 번역어.\n" +
    "3. 키워드와 같은 어족의 파생어 — 어간을 공유하거나 키워드를 그대로 품고 있는 말.\n" +
    "4. 사전에 없는 지어낸 말.\n\n" +
    "연상이 약하거나 억지스럽거나 너무 넓은 것은 위반이 아닙니다. 반드시 통과시키세요.\n" +
    "위반이 확실할 때만 ok:false 로 하세요. reason 은 초등학생도 알아들을 쉬운 한국어 한 문장으로, "  +
    "어려운 말(파생어, 어족, 의성어, 고유명사 같은 용어)을 쓰지 말고 무엇이 문제인지만 말하세요. " +
    '예: "바다가 그대로 들어 있어요."\n\n항목:\n' +
    JSON.stringify(items, null, 1) +
    '\n\n오직 JSON만 출력하세요.\n{"results":[{"i":0,"ok":true,"reason":""}]}';

  var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
  return fetch(AI_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: AI_MODEL, max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
    signal: ctrl ? ctrl.signal : undefined,
  })
    .then(function (r) { clearTimeout(timer); return r; })
    .catch(function (e) { clearTimeout(timer); throw e; })
    .then(function (r) {

        .map(function (b) { return b.type === "text" ? b.text : ""; })
        .join("")
        .replace(/```json|```/g, "")

/* 프록시가 없으면 네트워크를 타지 않고 즉시 기본 검사만 한다 */
function checkClues(pairs, clues) {

  return judgeClues(pairs, clues)
    .then(function (v) { return { verdict: v, ai: true }; })
    .catch(function () { return { verdict: basicJudge(pairs, clues), ai: false }; });
}

/* 받침을 떼고 비교하면 바다 → 바닷가 같은 사이시옷 변형도 걸린다 */
function stripTail(t) {
  var out = "";
  for (var i = 0; i < t.length; i++) {
    var code = t.charCodeAt(i) - 0xac00;
    if (code >= 0 && code < 11172 && code % 28) out += String.fromCharCode(0xac00 + code - (code % 28));
    else out += t[i];
  }
  return out;
}

/* AI 를 못 쓸 때의 기본 검사 */
function basicJudge(pairs, clues) {
  return clues.map(function (raw, i) {
    var c = raw.trim();
    if (!c) return "단서를 적어주세요.";
    if (/\s/.test(c)) return "띄어쓰기 없이 한 단어로 적어주세요.";
    for (var j = 0; j < pairs[i].length; j++) {
      var k = pairs[i][j];
      if (c === k) return "짝에 있는 " + k + " 를 그대로 썼어요.";
      if (c.length > 1 && (c.indexOf(k) >= 0 || k.indexOf(c) >= 0))
        return k + " 가 들어 있는 말은 쓸 수 없어요.";
      var nc = stripTail(c), nk = stripTail(k);
      if (nk.length > 1 && c.length > 1 && (nc.indexOf(nk) >= 0 || nk.indexOf(nc) >= 0))
        return k + " 에서 갈라져 나온 말 같아요.";
    }
    return "";
  });
}

/* ─────────── 저장 ─────────── */
function loadMe() {

  if (S.me) S.nameInput = S.me.name;
}
function saveMe(name) {

/* ─────────── 동기화 ─────────── */
function notice(t) {
  S.notice = t;
  render();
}

function commit(fn) {
  if (!net || !S.code) return Promise.resolve();
  var attempt = 0;
  function step() {
    return net.read(S.code).then(function (cur) {
      if (!cur) return;
      var next = fn(clone(cur));
      if (!next) return;
      if (S.me) {
        next.seen = next.seen || {};
        next.seen[S.me.id] = Date.now();
      }
      next.rev = (cur.rev || 0) + 1;
      next.stamp = uid();
      next.updatedAt = Date.now();
      return net.write(next).then(function (ok) {
        if (!ok) return notice("동기화에 실패했어요. 잠시 후 다시 시도해 주세요.");
        return net.read(S.code).then(function (after) {
          if (!after || after.stamp === next.stamp) {
            stamp = next.stamp;
            S.room = after || next;
            render();
            return;
          }
          if (++attempt < 3) return step();
          notice("다른 사람과 동시에 조작해서 반영되지 않았어요. 한 번 더 눌러주세요.");
        });
      });
    });
  }

}

}

  if (!S.sound) return;
  try { if (navigator.vibrate) navigator.vibrate(high ? [70, 50, 70] : 45); } catch (e) {}

  try {
    [0, 0.13].forEach(function (delay, i) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = high ? (i ? 988 : 659) : (i ? 587 : 523);
      var t = audioCtx.currentTime + delay;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.25);

  } catch (e) {}
}

var lastAlert = null;
function alertTurn(r) {

  var key = r.phase + ":" + r.turnIndex + ":" + (r.round ? r.round.spectatorId : "");
  if (lastAlert === null) { lastAlert = key; return; }
  if (lastAlert === key) return;
  lastAlert = key;
  if (r.phase === "resolution" && r.round) {
    if (r.round.spectatorId === S.me.id) {
      chime(true);
      notice("당신의 클로버 차례예요. 이제 말하면 안 됩니다.");
    } else {
      chime(false);
      var spec = r.players.filter(function (p) { return p.id === r.round.spectatorId; })[0];
      notice((spec ? spec.name : "") + " 님의 클로버를 맞힐 차례예요.");
    }
  } else if (r.phase === "end") {
    chime(false);
  }
}

var AWAY_MS = 60000;
function isAway(r, id) {
  if (!r || S.mode !== "online") return false;
  var t = r.seen && r.seen[id];
  return !t || Date.now() - t > AWAY_MS;
}

var beatTimer = null;
function beat() {
  if (S.mode !== "online" || !S.code || !S.me || !net) return;
  net.read(S.code).then(function (cur) {
    if (!cur || !cur.players.some(function (p) { return p.id === S.me.id; })) return;
    var t = cur.seen && cur.seen[S.me.id];
    if (t && Date.now() - t < AWAY_MS / 3) return;   // 방금 갱신했으면 건너뛴다
    cur.seen = cur.seen || {};
    cur.seen[S.me.id] = Date.now();
    cur.stamp = uid();
    net.write(cur);
  });
}
function startBeat() {
  stopBeat();
  if (S.mode !== "online") return;
  beat();
  beatTimer = setInterval(beat, 20000);
  document.addEventListener("visibilitychange", beat);
}
function stopBeat() {
  if (beatTimer) clearInterval(beatTimer);
  beatTimer = null;
  document.removeEventListener("visibilitychange", beat);
}

function watch(code) {
  if (unsub) unsub();
  misses = 0;
  unsub = net.subscribe(code, function (r) {
    if (!r) {
      if (++misses === 4) notice("방과 연결이 끊겼어요. 잠시 뒤 다시 이어집니다.");
      return;
    }
    misses = 0;
    if (r.stamp !== stamp) {
      stamp = r.stamp;
      S.room = r;
      if (r.phase === "end") saveLegend();
      alertTurn(r);
      render();
    }
    var amHost = r.hostId === (S.me && S.me.id) || !r.players.some(function (p) { return p.id === r.hostId; });
    if (amHost && needsRepair(r)) commit(function (st) { return repairState(st) ? st : null; });
  });
}

function blankRoom(code, players, hostId) {
  return {
    code: code, rev: 1, stamp: uid(), phase: "lobby", hostId: hostId, players: players,
    boards: {}, order: [], turnIndex: 0, round: null, results: [], chat: [], seen: {},
    deck: "all", extra: 1, createdAt: Date.now(),
  };
}

function createRoom() {
  var person = saveMe(S.nameInput);
  var c = makeCode();
  var tryCode = function (n) {
    return net.read(c).then(function (found) {
      if (found && n < 5) { c = makeCode(); return tryCode(n + 1); }
      var state = blankRoom(c, [{ id: person.id, name: person.name }], person.id);
      return net.write(state).then(function (ok) {
        if (!ok) return notice("방을 만들지 못했어요.");
        stamp = state.stamp;
        S.mode = "online";
        S.room = state;
        S.code = c;
        rememberLastRoom(c);
        watch(c);
        startBeat();
        render();

    });
  };
  return tryCode(0);
}

}

/* 방에 들어가기. 동시에 여러 명이 입장해도 덮어쓰이지 않도록 확인 후 재시도한다 */
function enterRoom(c, withNick) {

    return net.read(c).then(function (found) {
      if (!found) {
        forgetLastRoom();
        return notice(c + " 방을 찾지 못했어요.");
      }
      var person = withNick ? saveMe(S.nameInput) : S.me;
      if (!person) return notice("닉네임을 먼저 정해주세요.");
      var already = found.players.some(function (p) { return p.id === person.id; });
      if (!already && found.phase !== "lobby") return notice("이미 시작한 방이에요. 판이 끝나면 들어올 수 있어요.");
      if (!already && found.players.length >= 6) return notice("한 방에 최대 6명이에요.");

      var next = clone(found), nick = person.name;
      var taken = next.players.filter(function (x) { return x.id !== person.id; }).map(function (x) { return x.name; });
      for (var n = 2; taken.indexOf(nick) >= 0; n++) nick = person.name.slice(0, 6) + n;
      var changed = true;
      if (already) {
        var p = next.players.filter(function (x) { return x.id === person.id; })[0];
        changed = p.name !== nick;
        p.name = nick;
      } else {
        next.players.push({ id: person.id, name: nick });
      }

      var settle = function (doc) {
        stamp = doc.stamp;
        S.mode = "online";
        S.room = doc;
        S.code = c;
        rememberLastRoom(c);
        watch(c);
        startBeat();
        render();
      };
      if (!changed) return settle(found);

      next.rev = (found.rev || 0) + 1;
      next.stamp = uid();
      return net.write(next).then(function () {
        return net.read(c).then(function (after) {
          if (after && after.stamp !== next.stamp && ++attempt < 3) return step();
          settle(after && after.stamp === next.stamp ? after : next);
        });
      });
    });
  }
  return step();
}

/* 새로고침해도 하던 방으로 돌아올 수 있게 기억해 둔다 */
var LAST_KEY = "soclover:last";
function rememberLastRoom(c) {
  store.set(LAST_KEY, JSON.stringify({ code: c, t: Date.now() }));
}
function forgetLastRoom() {
  store.set(LAST_KEY, "");
  S.lastRoom = null;
}
function readLastRoom() {
  try {
    var v = JSON.parse(store.get(LAST_KEY) || "null");
    if (!v || !v.code) return null;
    return Date.now() - v.t < 12 * 3600 * 1000 ? v : null;
  } catch (e) { return null; }
}

/* 초대 링크: ?r=코드 로 들어오면 코드로 참여 화면에 자동으로 채워준다 */
function readInviteCode() {
  try {
    var qs = new URLSearchParams(location.search);
    var c = (qs.get("r") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
    return c.length === 4 ? c : null;
  } catch (e) { return null; }
}
function inviteLink(code) {
  return location.origin + location.pathname + "?r=" + code;
}
function copyInviteLink() {
  if (!S.room) return;
  var link = inviteLink(S.room.code);
  var done = function () { notice("초대 링크를 복사했어요."); };
  var fail = function () { notice(link); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(done, fail);
  } else {
    fail();
  }
}

function startLocal() {
  var list = S.locals.map(function (l) { return l.trim(); }).filter(Boolean);
  if (list.length < 2) return notice("이름을 두 명 이상 적어주세요.");
  var players = list.map(function (n) { return { id: uid(), name: n.slice(0, 8) }; });
  net = makeMemNet();
  var state = blankRoom("LOCAL", players, players[0].id);
  return net.write(state).then(function () {
    stamp = state.stamp;
    S.mode = "local";
    S.room = state;
    S.code = "LOCAL";
    S.acked = null;
    watch("LOCAL");
    render();
  });
}

function leaveRoom() {
  var done = Promise.resolve();
  if (S.mode === "online" && S.room && S.room.phase === "lobby" && S.me) {
    var myId = S.me.id;
    done = commit(function (st) {
      if (!st.players.some(function (p) { return p.id === myId; })) return null;
      st.players = st.players.filter(function (p) { return p.id !== myId; });
      if (st.hostId === myId && st.players[0]) st.hostId = st.players[0].id;
      return st;
    }).catch(function () {
      /* 서버 저장이 실패하거나 네트워크 오류가 나도, 이 화면은 반드시 방을 나가야 한다.
         (원격 동기화가 안 됐을 수는 있지만, 사용자가 방에 갇혀 있으면 안 된다.) */
    });
  }
  return done.then(function () {
    forgetLastRoom();
    stopBeat();
    if (unsub) unsub();
    unsub = null;
    stamp = null;
    S.room = null;
    S.code = null;
    S.mode = null;
    S.view = "menu";
    S.acked = null;
    S.picked = null;
    net = window.__fbNet || browserNet;
    S.legends = readLegends();
    render();
  });
}

/* ─────────── 로컬 플레이: 지금 화면을 볼 사람 ─────────── */
function localViewer() {
  var r = S.room;
  if (r.phase === "clues") {
    var p = r.players.filter(function (p) { return !(r.boards[p.id] && r.boards[p.id].submitted); })[0];
    return { id: p && p.id, token: "clues:" + (p && p.id) };
  }
  if (r.phase === "resolution") {
    var q = r.players.filter(function (p) { return p.id !== r.round.spectatorId; })[0];
    return { id: q && q.id, token: "res:" + r.round.spectatorId };
  }
  return { id: r.players[0] && r.players[0].id, token: null };
}
function viewerId() {
  return S.mode === "local" ? localViewer().id : S.me && S.me.id;
}

/* 같은 화면인지 판별 — 바뀌었을 때만 스크롤을 올린다 */
function screenKey() {
  var r = S.room;
  if (!r) return "home:" + S.view + ":" + (S.pPhase || "") + ":" + (S.pRound && S.pRound.result ? 1 : 0);
  var b = r.boards[viewerId()];
  return [S.mode, r.phase, r.turnIndex, b && b.submitted ? 1 : 0,
    r.round && r.round.result ? 1 : 0, S.acked || ""].join("|");
}
var lastScreen = null;

function render() {
  var html = S.room ? viewTable() : viewHome();
  html = (S.notice ? noticeBar() : "") + html;
  if (html === lastHTML) return;

  var active = document.activeElement;
  var fkey = active && active.dataset ? active.dataset.f : null;
  var caret = null;
  try { caret = active && active.selectionStart; } catch (e) {}

  root.innerHTML = html;
  lastHTML = html;

  if (fkey) {
    var el = root.querySelector('[data-f="' + fkey + '"]');
    if (el) {
      el.focus();
      try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) {}
    }
  }
  var key = screenKey();
  if (key !== lastScreen) {
    lastScreen = key;
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  afterRender();
}

      ? "기기를 넘겨주세요. 다른 사람은 화면을 보면 안 돼요."
      : "출제자를 뺀 나머지가 함께 카드를 맞춥니다. 출제자는 이 단계에서 말할 수 없어요.") + "</p>" +
    '<button class="sc-btn" data-a="ack" data-v="' + esc(lv.token) + '">' +
    (clues ? "내가 볼게요" : "준비됐어요") + "</button></div>"
  );
}

function viewLobby() {
  var r = S.room, isLocal = S.mode === "local";
  var isHost = isLocal || r.hostId === (S.me && S.me.id);
  return (
    '<h2 class="sc-h2">참가자 ' + r.players.length + "명</h2>" +
    '<ul class="sc-players">' +
    r.players.map(function (p) {
      var away = isAway(r, p.id);
      return (
        '<li' + (away ? ' class="away"' : "") + '><span class="sc-leafdot' + (away ? " off" : "") + '"></span>' +
        esc(p.name) +
        (!isLocal && p.id === r.hostId ? '<em class="sc-badge">방장</em>' : "") +
        (!isLocal && S.me && p.id === S.me.id ? '<em class="sc-badge me">나</em>' : "") +
        (away ? '<em class="sc-badge away">자리 비움</em>' : "") +
        (away && isHost && S.me && p.id !== S.me.id
          ? '<button class="sc-kick" data-a="kick" data-v="' + p.id + '" aria-label="내보내기">×</button>'
          : "") +
        "</li>"
      );
    }).join("") +
    "</ul>" +
    (!isLocal
      ? S.renaming
        ? '<div class="sc-sendrow sc-mb"><input class="sc-input" data-f="rn" data-in="rename" value="' +
          esc(S.renameInput) + '" maxlength="8" placeholder="새 닉네임"/>' +
          '<button class="sc-send" data-a="saveRename">저장</button></div>'
        : '<button class="sc-mini-btn sc-light" data-a="rename">닉네임 바꾸기</button>'
      : "") +
    '<div class="sc-deck"><div class="sc-deckhead"><span>단어 난이도</span>' +
    (isHost ? "" : "<em>" + DECK_NAMES[r.deck || "all"] + "</em>") + "</div>" +
    (isHost
      ? '<div class="sc-seg">' +
        ["easy", "all", "hard"].map(function (k) {
          return '<button class="' + ((r.deck || "all") === k ? "on" : "") +
            '" data-a="deck" data-v="' + k + '">' + DECK_NAMES[k] + "</button>";
        }).join("") + "</div>"
      : "") +
    '<p class="sc-deckhint">' + DECK_HINTS[r.deck || "all"] + "</p></div>" +
    '<div class="sc-deck"><div class="sc-deckhead"><span>가짜 카드</span>' +
    (isHost ? "" : "<em>" + (r.extra || 1) + "장</em>") + "</div>" +
    (isHost
      ? '<div class="sc-seg">' +
        [1, 2, 3].map(function (k) {
          return '<button class="' + ((r.extra || 1) === k ? "on" : "") +
            '" data-a="extra" data-v="' + k + '">' + k + "장</button>";
        }).join("") + "</div>"
      : "") +
    '<p class="sc-deckhint">' + EXTRA_HINTS[r.extra || 1] + "</p></div>" +
    (!isLocal ? '<p class="sc-dim">코드를 친구에게 알려주세요. “코드로 참여”로 들어오거나, 아래 링크를 보내면 코드까지 자동으로 채워져요.</p>' +
      '<button class="sc-mini-btn sc-light" data-a="copyInvite">🔗 초대 링크 복사</button>' : "") +
    (isHost
      ? '<button class="sc-btn" data-a="start"' + (r.players.length < 2 ? " disabled" : "") + ">" +
        (r.players.length < 2 ? "2명부터 시작할 수 있어요" : "게임 시작") + "</button>"
      : '<p class="sc-wait">방장이 시작하기를 기다리는 중…</p>')
  );
}

function viewScore() {
  var r = S.room, results = r.results || [];
  var total = results.reduce(function (a, x) { return a + x.points; }, 0);
  var max = r.order.length * 6;
  return (
    '<div class="sc-scorebar"><div class="sc-scorenum"><b>' + total + "</b><span>/ " + max + "</span></div>" +
    '<div class="sc-pips">' +
    r.order.map(function (id, i) {
      var res = results[i];
      var p = r.players.filter(function (x) { return x.id === id; })[0];
      var now = r.phase === "resolution" && i === r.turnIndex && !(r.round && r.round.result);
      var cls = res ? (res.points === 6 ? "perfect" : res.points > 0 ? "some" : "zero") : now ? "now" : "todo";
      return '<span class="sc-pip ' + cls + '" title="' + esc(p ? p.name : "") + '">' +
        (res ? res.points : esc((p ? p.name : "?").slice(0, 1))) + "</span>";
    }).join("") +
    '</div><span class="sc-scoretail">' +
    (r.phase === "clues" ? "단서 작성 중" : results.length + " / " + r.order.length + " 판") +
    "</span></div>"
  );
}

/* ─────────── 단서 쓰기 ─────────── */
function viewClues() {
  var r = S.room, vid = viewerId(), board = r.boards[vid];
  if (!board) return '<p class="sc-wait">이번 판은 관전 중이에요.</p>';

  if (board.submitted) {
    var waiting = r.players.filter(function (p) { return !(r.boards[p.id] && r.boards[p.id].submitted); });
    var isHost = S.mode !== "local" && r.hostId === (S.me && S.me.id);
    return (
      '<h2 class="sc-h2">단서 제출 완료</h2><p class="sc-wait">' +
      (waiting.length
        ? esc(waiting.map(function (p) { return p.name; }).join(", ")) + " 님을 기다리는 중…"
        : "곧 시작해요…") +
      "</p>" +
      (waiting.length
        ? '<ul class="sc-waitlist">' +
          waiting.map(function (p) {
            var away = isAway(r, p.id);
            return '<li><span class="sc-leafdot' + (away ? " off" : "") + '"></span>' + esc(p.name) +
              '<em>' + (away ? "자리 비움" : "작성 중") + "</em>" +
              (isHost
                ? '<button class="sc-mini-btn sc-light" data-a="kick" data-v="' + p.id + '">빼고 진행</button>'
                : "") + "</li>";
          }).join("") + "</ul>"
        : "")
    );
  }

  var placed = board.solution.map(function (s) { return { card: board.cards[s.cardId], rot: s.rot }; });
  var pairs = pairWordsOf(board);
  var filled = S.draft.every(function (d) { return d.trim().length; });
  var who = r.players.filter(function (p) { return p.id === vid; })[0];
  var i = S.clueIdx;

  return (
    '<h2 class="sc-h2">' + (S.mode === "local" ? esc(who ? who.name : "") + "의 클로버" : "내 클로버") + "</h2>" +
    '<p class="sc-dim sc-tight">보드의 흰 칸을 눌러 고르고, 아래에 단서를 적으세요.</p>' +
    boardHTML({ placed: placed, clues: S.draft, readOnly: true, editable: true, sel: i }) +
    '<div class="sc-editor"><div class="sc-editnav">' +
    '<button class="sc-arrow" data-a="prevClue" aria-label="이전 칸">‹</button>' +
    '<div class="sc-editpair"><span class="sc-pos">' + CLUE_NAME[i] + "</span><b>" +
    esc(pairs[i][0]) + '</b><span class="sc-plus">+</span><b>' + esc(pairs[i][1]) + "</b></div>" +
    '<button class="sc-arrow" data-a="nextClue" aria-label="다음 칸">›</button></div>' +
    '<input class="sc-input sc-marker' + (S.errors[i] ? " bad" : "") + '" data-f="clue" data-in="draft" data-i="' +
    i + '" value="' + esc(S.draft[i]) + '" maxlength="14" placeholder="두 단어를 잇는 한 단어"/>' +
    (S.errors[i] ? '<p class="sc-err">' + esc(S.errors[i]) + "</p>" : "") +
    '<div class="sc-dots">' +
    [0, 1, 2, 3].map(function (n) {
      return '<button class="sc-dot' + (n === i ? " on" : "") + (S.draft[n].trim() ? " done" : "") +
        (S.errors[n] ? " bad" : "") + '" data-a="pickClue" data-v="' + n + '" aria-label="' +
        CLUE_NAME[n] + ' 칸"></button>';
    }).join("") +
    "</div></div>" +
    '<section class="sc-rulecard"><button class="sc-howhead" data-a="ruleToggle" aria-expanded="' +
    S.ruleOpen + '"><span>쓸 수 없는 단서</span><em>' + (S.ruleOpen ? "접기" : "펴기") + "</em></button>" +
    (S.ruleOpen
      ? '<div class="sc-rulebody">' + ruleListHTML() +
        '<p class="sc-howmeta">' + RULE_OK_LINE + "</p></div>"
      : "") +
    "</section>" +
    '<button class="sc-btn" data-a="submitClues"' + (!filled || S.checking ? " disabled" : "") + ">" +
    (S.checking ? "단서 검사 중…" : filled ? "단서 제출" : "네 칸을 모두 채우세요") + "</button>" +
    (S.aiDown ? '<p class="sc-dim sc-tight">기본 규칙만 확인했어요.</p>' : "")
  );
}

/* ─────────── 해결 단계 ─────────── */
function viewResolution() {
  var r = S.room, round = r.round, board = r.boards[round.spectatorId];
  var spec = r.players.filter(function (p) { return p.id === round.spectatorId; })[0];
  var amSpectator = S.mode !== "local" && round.spectatorId === (S.me && S.me.id);
  var used = round.placement.filter(Boolean).map(function (p) { return p.cardId; });
  var tray = round.pool.filter(function (id) { return used.indexOf(id) < 0; });
  var ready = round.placement.every(Boolean);

  var placedView = round.placement.map(function (p) {
    return p ? { card: board.cards[p.cardId], rot: p.rot } : null;
  });
  var solutionView = board.solution.map(function (s) {
    return { card: board.cards[s.cardId], rot: s.rot };
  });

  var html =
    '<div class="sc-turnbar"><span>' + (r.turnIndex + 1) + " / " + r.order.length + "</span><strong>" +
    esc(spec ? spec.name : "") + "의 클로버</strong><span>" +
    (round.attempt === 1 ? "첫 시도" : "마지막 시도") + "</span></div>";

  if (amSpectator && !round.result)
    html +=
      '<div class="sc-hush"><h2>지금은 말하지 마세요</h2>' +
      "<p>팀이 당신의 카드를 맞추는 중이에요. 채팅도 이 단계에서는 잠깁니다.</p></div>";
  else if (!round.result)
    html += '<p class="sc-dim">단서를 보고 카드를 놓으세요. 놓인 카드를 누르면 90°씩 돌아갑니다.</p>';

  html += boardHTML({
    placed: round.result ? solutionView : placedView,
    clues: board.clues,
    locked: round.locked,
    correct: round.result ? round.result.correct : null,
    score: round.result ? round.result.points : null,
    readOnly: amSpectator || !!round.result,
    picked: S.picked,
    write: true,
  });

  if (!round.result && !amSpectator) {
    html +=
      '<div class="sc-tray">' +
      (tray.length
        ? tray.map(function (id) {
            return '<button class="sc-traycard' + (S.picked === id ? " picked" : "") +
              '" data-a="pick" data-v="' + id + '"><div class="sc-minicard">' +
              faceHTML(board.cards[id], 0, null, "mini" + id) + "</div></button>";
          }).join("")
        : '<p class="sc-dim">남은 카드 없음 — ' + (4 + (r.extra || 1)) + "장 중 " +
          (r.extra || 1) + "장은 가짜예요.</p>") +
      "</div>" +
      '<button class="sc-btn" data-a="check"' + (ready ? "" : " disabled") + ">" +
      (ready ? "이대로 확인" : "네 칸을 모두 채우세요") + "</button>";
  }
  if (!round.result && amSpectator) html += '<p class="sc-wait">팀이 배치하는 중…</p>';
  if (!amSpectator && isAway(r, round.spectatorId))
    html += '<p class="sc-away">' + esc(spec ? spec.name : "") +
      " 님이 자리를 비운 것 같아요. 계속 진행해도 됩니다.</p>";

  if (round.result) {
    html +=
      '<div class="sc-result"><p class="sc-score">' + round.result.points + "점" +
      (round.result.perfect ? "<em>첫 시도에 전부 정답</em>" : "") + "</p>" +
      '<p class="sc-dim">위 보드는 ' + esc(spec ? spec.name : "") + " 님의 실제 정답이에요.</p>" +
      (S.mode === "local" || amSpectator
        ? '<button class="sc-btn" data-a="next">다음 차례로</button>'
        : '<p class="sc-wait">' + esc(spec ? spec.name : "") + " 님이 넘기기를 기다리는 중…</p>") +
      "</div>";
  }
  return html;
}

/* ─────────── 연습모드 (혼자, 방/서버 없이) ─────────── */
function viewPractice() {
  var head = '<button class="sc-back sc-backw" data-a="practiceExit">← 뒤로</button>' +
    '<h2 class="sc-h2">연습모드</h2>';

  if (S.pPhase === "clue") {
    var board = S.pBoard;
    var placed = board.solution.map(function (s) { return { card: board.cards[s.cardId], rot: s.rot }; });
    var pairs = pairWordsOf(board);
    var filled = S.draft.every(function (d) { return d.trim().length; });
    var i = S.clueIdx;
    return (
      head +
      '<p class="sc-dim sc-tight">점수도, 정답 확인도 없어요. 마음껏 단서를 연습해 보세요. 다 쓰면 직접 맞혀볼 수도 있어요.</p>' +
      '<div class="sc-deck"><div class="sc-deckhead"><span>단어 난이도</span></div>' +
      '<div class="sc-seg">' +
      ["easy", "all", "hard"].map(function (k) {
        return '<button class="' + (S.pDeck === k ? "on" : "") + '" data-a="practiceDeck" data-v="' + k + '">' +
          DECK_NAMES[k] + "</button>";
      }).join("") + "</div></div>" +
      '<div class="sc-deck"><div class="sc-deckhead"><span>가짜 카드</span></div>' +
      '<div class="sc-seg">' +
      [1, 2, 3].map(function (k) {
        return '<button class="' + (S.pExtra === k ? "on" : "") + '" data-a="practiceExtra" data-v="' + k + '">' +
          k + "장</button>";
      }).join("") + "</div></div>" +
      boardHTML({ placed: placed, clues: S.draft, readOnly: true, editable: true, sel: i, centerAction: "practiceEnter", centerLabel: "다른 카드로 다시 뽑기" }) +
      '<div class="sc-editor"><div class="sc-editnav">' +
      '<button class="sc-arrow" data-a="prevClue" aria-label="이전 칸">‹</button>' +
      '<div class="sc-editpair"><span class="sc-pos">' + CLUE_NAME[i] + "</span><b>" +
      esc(pairs[i][0]) + '</b><span class="sc-plus">+</span><b>' + esc(pairs[i][1]) + "</b></div>" +
      '<button class="sc-arrow" data-a="nextClue" aria-label="다음 칸">›</button></div>' +
      '<input class="sc-input sc-marker' + (S.errors[i] ? " bad" : "") + '" data-f="clue" data-in="draft" data-i="' +
      i + '" value="' + esc(S.draft[i]) + '" maxlength="14" placeholder="두 단어를 잇는 한 단어"/>' +
      (S.errors[i] ? '<p class="sc-err">' + esc(S.errors[i]) + "</p>" : "") +
      '<div class="sc-dots">' +
      [0, 1, 2, 3].map(function (n) {
        return '<button class="sc-dot' + (n === i ? " on" : "") + (S.draft[n].trim() ? " done" : "") +
          (S.errors[n] ? " bad" : "") + '" data-a="pickClue" data-v="' + n + '" aria-label="' +
          CLUE_NAME[n] + ' 칸"></button>';
      }).join("") +
      "</div></div>" +
      '<section class="sc-rulecard"><button class="sc-howhead" data-a="ruleToggle" aria-expanded="' +
      S.ruleOpen + '"><span>쓸 수 없는 단서</span><em>' + (S.ruleOpen ? "접기" : "펴기") + "</em></button>" +
      (S.ruleOpen
        ? '<div class="sc-rulebody">' + ruleListHTML() +
          '<p class="sc-howmeta">' + RULE_OK_LINE + "</p></div>"
        : "") +
      "</section>" +
      '<button class="sc-btn" data-a="practiceSubmit"' + (!filled ? " disabled" : "") + ">" +
      (filled ? "다 썼으면 직접 맞혀보기" : "네 칸을 모두 채우세요") + "</button>"
    );
  }

  var round = S.pRound, board2 = S.pBoard;
  var used = round.placement.filter(Boolean).map(function (p) { return p.cardId; });
  var tray = used.length ? round.pool.filter(function (id) { return used.indexOf(id) < 0; }) : round.pool;
  var ready = round.placement.every(Boolean);
  var placedView = round.placement.map(function (p) {
    return p ? { card: board2.cards[p.cardId], rot: p.rot } : null;
  });
  var solutionView = board2.solution.map(function (s) {
    return { card: board2.cards[s.cardId], rot: s.rot };
  });

  var html = head +
    '<p class="sc-dim sc-tight">' +
    (round.result ? "결과를 확인해 보세요." : "조금 전에 쓴 단서를 보고, 카드를 제자리에 놓아 보세요. 놓인 카드를 누르면 90°씩 돌아갑니다.") +
    "</p>" +
    boardHTML({
      placed: round.result ? solutionView : placedView,
      clues: board2.clues,
      locked: round.locked,
      correct: round.result ? round.result.correct : null,
      score: round.result ? round.result.points : null,
      readOnly: !!round.result,
      picked: S.picked,
      write: true,
      slotAction: "practiceSlot",
      pullAction: "practicePull",
    });

  if (!round.result) {
    html +=
      '<div class="sc-tray">' +
      (tray.length
        ? tray.map(function (id) {
            return '<button class="sc-traycard' + (S.picked === id ? " picked" : "") +
              '" data-a="practicePick" data-v="' + id + '"><div class="sc-minicard">' +
              faceHTML(board2.cards[id], 0, null, "pmini" + id) + "</div></button>";
          }).join("")
        : '<p class="sc-dim">남은 카드 없음</p>') +
      "</div>" +
      '<button class="sc-btn" data-a="practiceCheck"' + (ready ? "" : " disabled") + ">" +
      (ready ? "이대로 확인" : "네 칸을 모두 채우세요") + "</button>";
  }

  if (round.result) {
    html +=
      '<div class="sc-result"><p class="sc-score">' + round.result.points + "점" +
      (round.result.perfect ? "<em>첫 시도에 전부 정답</em>" : "") + "</p>" +
      '<button class="sc-btn" data-a="practiceAgain">새 카드로 다시 연습</button>' +
      '<button class="sc-mini-btn sc-light" data-a="practiceExit">연습모드 나가기</button>' +
      "</div>";
  }
  return html;
}

/* ─────────── 결과 ─────────── */
function viewEnd() {
  if (S.review) return viewReview();
  var r = S.room;
  var total = r.results.reduce(function (a, x) { return a + x.points; }, 0);
  var max = r.order.length * 6;
  return (
    '<h2 class="sc-h2">전설의 기록</h2>' +
    '<div class="sc-bigscore"><span>' + total + "</span><em>/ " + max + "</em></div>" +
    '<ul class="sc-tally">' +
    r.order.map(function (id, i) {
      var p = r.players.filter(function (q) { return q.id === id; })[0];
      var res = r.results[i];
      return '<li><button data-a="review" data-v="' + id + '"><span>' + esc(p ? p.name : "") +
        "</span><b>" + (res ? res.points : 0) + '점</b><i class="sc-chev">›</i></button></li>';
    }).join("") +
    "</ul>" +
    '<p class="sc-dim sc-tight">이름을 누르면 그 사람의 클로버와 단서를 다시 볼 수 있어요.</p>' +
    (S.endNote ? '<p class="sc-dim">' + esc(S.endNote) + "</p>" : "") +
    '<button class="sc-btn" data-a="again">같은 멤버로 한 판 더</button>' +
    '<p class="sc-credit">made by m00n</p>'
  );
}

/* 지난 판 다시 보기 — 판이 끝난 뒤 서로의 단서를 펼쳐 본다 */
function viewReview() {
  var r = S.room, pid = S.review, b = r.boards[pid];
  if (!b) { S.review = null; return viewEnd(); }
  var i = r.order.indexOf(pid);
  var p = r.players.filter(function (q) { return q.id === pid; })[0];
  var res = r.results[i];
  var placed = b.solution.map(function (x) { return { card: b.cards[x.cardId], rot: x.rot }; });
  var pairs = pairWordsOf(b);
  var prev = r.order[(i + r.order.length - 1) % r.order.length];
  var next = r.order[(i + 1) % r.order.length];

  return (
    '<button class="sc-back sc-backw" data-a="closeReview">← 점수판</button>' +
    '<div class="sc-reviewhead"><button class="sc-arrow" data-a="review" data-v="' + prev + '">‹</button>' +
    "<div><b>" + esc(p ? p.name : "") + "의 클로버</b><em>" +
    (res ? res.points + "점" : "-") + "</em></div>" +
    '<button class="sc-arrow" data-a="review" data-v="' + next + '">›</button></div>' +
    boardHTML({
      placed: placed, clues: b.clues, readOnly: true, write: true,
      score: res ? res.points : null,
      correct: res && res.correct ? res.correct : null,
    }) +
    '<ul class="sc-pairlist">' +
    pairs.map(function (pair, n) {
      return '<li><span class="sc-pos">' + CLUE_NAME[n] + "</span><b>" + esc(pair[0]) +
        '</b><i>+</i><b>' + esc(pair[1]) + '</b><em>' + esc(b.clues[n] || "") + "</em></li>";
    }).join("") +
    "</ul>" +
    (res && res.correct
      ? '<p class="sc-dim sc-tight">○ 표시가 팀이 맞힌 카드예요.</p>'
      : "")
  );
}
